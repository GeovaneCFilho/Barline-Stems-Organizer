name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Check that the executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter Barline.exe | Select-Object -First 1
          if (-not $exe) { throw "Barline.exe não foi gerado" }
          Write-Host "OK: $($exe.FullName)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barline-windows
          path: build/Barline_artefacts/Release/Barline.exe
          if-no-files-found: error
